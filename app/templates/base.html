<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Equilibrium{% endblock %}
    </title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ url_for('static', filename='img/icon.svg') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}

</body>

</html>
