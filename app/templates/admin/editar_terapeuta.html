<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Editar Terapeuta • Equilibrium</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/app.css') }}"
>

<link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', filename='img/icon.svg') }}"
>


</head>

<body>

<main class="container">

    <h1>Editar Terapeuta</h1>

    <div class="messages">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="msg {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}

    </div>

    <form
        method="POST"
        action="{{ url_for(
            'admin.editar_usuario',
            usuario_id=usuario.id
        ) }}"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="nome">Nome</label>

        <input
            id="nome"
            name="nome"
            type="text"
            required
            maxlength="100"
            value="{{ usuario.nome }}"
            autocomplete="name"
        >


        <label for="email">E-mail</label>

        <input
            id="email"
            name="email"
            type="email"
            required
            maxlength="100"
            value="{{ usuario.email }}"
            autocomplete="email"
        >


        <label for="telefone">Telefone</label>

        <input
            id="telefone"
            name="telefone"
            type="tel"
            required
            maxlength="20"
            value="{{ usuario.telefone }}"
            autocomplete="tel"
        >


        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <p>
        <a href="{{ url_for('admin.usuarios') }}">
            Voltar para usuários
        </a>
    </p>

</main>


</body>

</html>
