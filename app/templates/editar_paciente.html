<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Editar paciente - Equilibrium</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><header class="header"><div class="nav-links"><h2>Equilibrium</h2><a href="{{ url_for('paciente.gerir_pacientes') }}">Pacientes</a><a href="{{ url_for('dashboard.index') }}">Dashboard</a></div><a class="btn-logout" href="{{ url_for('auth.logout') }}">Sair</a></header><main class="card form-card"><h2>Editar paciente</h2><div class="messages">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="msg {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}</div><form method="post"><label for="nome">Nome</label><input id="nome" name="nome" value="{{ paciente.nome }}" required><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ paciente.email or '' }}"><label for="telefone">Telefone</label><input id="telefone" name="telefone" value="{{ paciente.telefone or '' }}"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" rows="5">{{ paciente.observacoes or '' }}</textarea><div class="form-actions"><a href="{{ url_for('paciente.gerir_pacientes') }}">Cancelar</a><button type="submit">Salvar alterações</button></div></form></main></body></html>
