{% extends "app_base.html" %}


{% block title %}
Cadastrar terapeuta • Equilibrium
{% endblock %}


{% block app_content %}

<main class="login-container">

    <div class="logo">
        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            alt="logo-equilibrium"
        >
    </div>

    <h1>Cadastro de Terapeuta</h1>

    <form
        method="post"
        action="{{ url_for('auth.cadastro_terapeuta') }}"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label for="nome">Nome</label>

        <input
            id="nome"
            name="nome"
            type="text"
            required
            maxlength="100"
            autocomplete="name"
            placeholder="Nome completo"
        >


        <label for="email">E-mail</label>

        <input
            id="email"
            name="email"
            type="email"
            required
            maxlength="100"
            autocomplete="email"
            placeholder="seu@email.com"
        >


        <label for="telefone">Telefone</label>

        <input
            id="telefone"
            name="telefone"
            type="tel"
            required
            maxlength="20"
            autocomplete="tel"
            placeholder="(00) 00000-0000"
        >


        <label for="senha">Senha</label>

        <input
            id="senha"
            name="senha"
            type="password"
            required
            autocomplete="new-password"
            placeholder="••••••••"
        >

        

        <div style="display: flex; gap: 10px; margin-top: 20px; flex-direction: column;">
            <button type="submit" class="button button-primary form-submit">Cadastrar Terapeuta</button>
            <a href="{{ url_for('admin.usuarios') }}" class="button button-primary form-submit" style="background: transparent; color: var(--muted); border: 1px solid var(--line); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0 16px; border-radius: 6px;">
                Voltar
            </a>
        </div>

    </form>

</main>

{% endblock %}
