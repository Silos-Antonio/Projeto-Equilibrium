<!DOCTYPE html><html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Equilibrium</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.svg') }}">
    </head>
    
    <body class="login-page">
        <main class="login-container">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo-equilibrium">
            </div>
            <div class="messages">{% with messages = get_flashed_messages(category_filter=['error']) %}{% for message in messages %}<div class="msg error">{{ message }}

            </div>{% endfor %}{% endwith %}</div>
            <form method="post" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required autofocus placeholder="seu@email.com">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" required placeholder="••••••••"> 
                <button><span class="text">Bem vindo!</span></button>

            </form>
        </main>
    </body>
    </html>
